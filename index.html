<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Accord</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FFFFFF;--bg-2:#F4F3F0;--bg-3:#FAF9F7;
    --ink:#1C1B19;--ink-2:#66645E;--muted:#9C9A92;--faint:#C3C0B8;
    --line:#ECEBE6;--line-2:#E1DFD8;--line-dk:#1D1B17;
    --accent:#567E70;--accent-press:#3F5B4F;--accent-soft:#E6F2DD;--accent-2:#88BDA4;
    --green:#2F8B57;--amber:#B0842B;--rust:#B0562F;
    --sp:cubic-bezier(.34,.7,.28,1);
  }
  @media(prefers-color-scheme:dark){:root{color-scheme:light}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#DCDAD3;color:var(--ink);font-family:"Space Grotesk",system-ui,-apple-system,Segoe UI,sans-serif;
    font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;display:flex;justify-content:center}
  #app{width:100%;max-width:430px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fill{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  svg{display:block}
  .num{font-variant-numeric:tabular-nums}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

  /* plate + score circle */
  .sc{border:2px solid;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;flex:none}
  .sc.hi{color:var(--green);border-color:var(--green)}
  .sc.mid{color:var(--amber);border-color:var(--amber)}
  .sc.lo{color:var(--rust);border-color:var(--rust)}
  .sc.sm{width:40px;height:40px;font-size:13.5px;border-width:2px}

  /* header (home) */
  .hbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;position:sticky;top:0;background:var(--bg);z-index:9}
  .brand{font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--accent)}
  .hbar .hicons{display:flex;align-items:center;gap:16px;color:var(--ink)}
  .hbar .hicons button{position:relative;display:grid;place-items:center}
  .hbar .badge{position:absolute;top:-4px;right:-5px;background:var(--accent);color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px}

  /* search + chips */
  .searchbar{display:flex;align-items:center;gap:10px;margin:8px 18px 0;padding:12px 15px;background:var(--bg-2);border-radius:26px;border:1.5px solid var(--line-dk);color:var(--muted);font-weight:500;font-size:14.5px}
  .searchbar:active{background:#EDECE8}
  .chiprow{display:flex;gap:9px;overflow-x:auto;padding:14px 18px 4px;-webkit-overflow-scrolling:touch}
  .chiprow::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:7px;padding:9px 15px;background:var(--bg-2);border-radius:22px;border:1.5px solid var(--line-dk);font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}
  .chip.on{background:var(--accent);color:#fff}
  .chip svg{opacity:.85}

  /* section head */
  .shead{display:flex;align-items:baseline;justify-content:space-between;padding:20px 18px 12px}
  .shead .st{font-size:15px;font-weight:700;letter-spacing:-.01em}
  .shead .sa{font-size:13.5px;font-weight:600;color:var(--accent)}

  /* featured guide cards */
  .grow{display:flex;gap:13px;overflow-x:auto;padding:0 18px 4px;-webkit-overflow-scrolling:touch}
  .grow::-webkit-scrollbar{display:none}
  .gcard{flex:none;width:210px;border-radius:16px;overflow:hidden;position:relative;border:1.5px solid var(--line-dk)}
  .gcover{aspect-ratio:5/4;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .gover{position:absolute;inset:0;background:linear-gradient(rgba(20,16,14,.12),rgba(20,16,14,.42) 52%,rgba(20,16,14,.9));display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff}
  .gtitle{font-weight:700;font-size:16px;line-height:1.12;letter-spacing:-.01em}
  .gprog{font-size:12px;color:rgba(255,255,255,.86);margin-top:5px;font-weight:500}

  /* feed */
  .feed{padding:4px 0 0}
  .frow{padding:18px;border-top:9px solid var(--bg-2);width:100%;text-align:left;display:block}
  .frow:first-child{border-top:0}
  .fhead{display:flex;align-items:flex-start;gap:12px}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px;flex:none;border:1.5px solid var(--line-dk)}
  .finfo{flex:1;min-width:0}
  .ftitle{font-size:15px;line-height:1.3}.ftitle b{font-weight:700}
  .fsub{font-size:13px;color:var(--muted);margin-top:2px}
  .fnotes{font-size:14px;margin-top:12px}.fnotes b{font-weight:700}
  .flikes{font-size:13px;color:var(--ink-2);margin-top:10px;font-weight:500}
  .factions{display:flex;align-items:center;gap:20px;margin-top:12px;color:var(--ink)}
  .factions .liked{color:var(--accent)}
  .factions .chk{margin-left:auto;color:var(--green)}
  .ftime{font-size:12px;color:var(--muted);margin-top:11px}
  .composebar{display:flex;align-items:center;gap:12px;width:calc(100% - 36px);margin:0 18px 4px;padding:10px 14px 10px 10px;border:1.5px solid var(--line-dk);border-radius:26px;color:var(--muted);font-weight:500;font-size:14.5px}
  .composebar>span{flex:1;text-align:left}
  .composebar:active{background:var(--bg-3)}
  .postbtn{font-weight:700;font-size:14.5px;color:var(--muted);padding:8px 16px;border-radius:20px;border:1.5px solid var(--line-dk)}
  .postbtn.on{background:var(--accent);color:#fff}
  .followbtn{flex:none;padding:8px 18px;border-radius:20px;border:1.5px solid var(--line-dk);font-size:13px;font-weight:700;color:var(--accent);background:none}
  .followbtn.on{background:var(--accent);color:#fff}
  .followbtn:active{opacity:.7}
  .ptick{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-dk);display:grid;place-items:center;color:#fff;flex:none;transition:background .12s}
  .ptick.on{background:var(--accent);border-color:var(--accent)}

  /* generic rows / lists */
  .list{padding:0 18px}
  .row{display:flex;align-items:center;gap:14px;padding:12px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}.row:active{background:var(--bg-3)}
  .rank{width:22px;text-align:center;font-weight:700;font-size:15px;color:var(--muted);flex:none}
  .rank.one{color:var(--accent)}
  .meta{flex:1;min-width:0}
  .nm{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hs{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .why{font-size:12px;color:var(--accent);font-weight:600;margin-top:3px}.why b{font-weight:700}
  .addbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-dk);color:var(--accent);flex:none}
  .addbtn:active{background:var(--accent-soft)}
  .reveal .row{animation:rise .5s var(--sp) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* nav */
  .nav{display:flex;align-items:flex-end;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg)}
  .nav .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;padding:5px 0}
  .nav .tab.on{color:var(--accent)}
  .nav .plus{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600}
  .nav .plus .pc{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;border:1.5px solid var(--line-dk)}
  .nav .plus:active .pc{background:var(--accent-press)}

  /* buttons */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--accent);color:#fff;font-weight:700;padding:15px;border-radius:13px;font-size:15px;border:1.5px solid var(--line-dk);transition:background .14s}
  .btn:active{background:var(--accent-press)}
  .btn.line{background:none;color:var(--ink);border:1.5px solid var(--line-dk);font-weight:600}
  .btn.line:active{background:var(--bg-3)}
  .btn[disabled]{opacity:.42}

  /* intro / centered */
  .center{flex:1;display:flex;flex-direction:column;justify-content:center;padding:34px 28px;text-align:center}
  .introart{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-bottom:30px}
  .introart>span:nth-child(2){transform:translateY(-14px)}
  .logo{font-size:52px;font-weight:700;letter-spacing:-.04em;color:var(--accent);margin-bottom:12px}
  .center h1{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.24;margin:0 auto 26px;max-width:20ch;color:var(--ink)}
  .center h1 b{color:var(--accent)}
  /* landing */
  .intro{flex:1;display:flex;flex-direction:column;padding:0 30px calc(34px + env(safe-area-inset-bottom))}
  .intromid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .ilogo{font-size:76px;font-weight:700;letter-spacing:-.05em;color:var(--accent);line-height:.9}
  .itag{font-size:23px;font-weight:300;letter-spacing:.01em;color:var(--ink-2)}
  .ibot{display:flex;flex-direction:column;gap:20px;align-items:center}
  .isub{text-align:center;color:var(--muted);font-size:14.5px;line-height:1.55;max-width:30ch;font-weight:400}
  .center p{color:var(--ink-2);margin:-14px auto 26px;max-width:30ch}

  /* pick grid */
  .top{display:flex;align-items:flex-end;justify-content:space-between;padding:20px 18px 14px}
  .htitle h1{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.04}
  .htitle .kick{margin-bottom:8px}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;padding:4px 18px 16px}
  .pick{display:flex;flex-direction:column;gap:8px;text-align:left;position:relative}
  .pick .pw{position:relative}
  .pick .pn{font-weight:700;font-size:12px;line-height:1.15;letter-spacing:-.01em}
  .pick .ph{font-size:10.5px;color:var(--muted);margin-top:1px}
  .pick .selring{position:absolute;inset:0;border-radius:11px;box-shadow:0 0 0 2.5px var(--accent);opacity:0;transition:opacity .12s}
  .pick.sel .selring{opacity:1}
  .pick .tick{position:absolute;top:7px;right:7px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center}
  .pick.sel .tick{display:grid}
  .foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,0),var(--bg) 34%)}

  /* progress */
  .pgwrap{padding:16px 18px 0}
  .pgbar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
  .pgbar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .45s var(--sp)}

  /* bucket */
  .qwrap{flex:1;display:flex;flex-direction:column}
  .qbody{flex:1;display:flex;flex-direction:column;padding:12px 26px 24px;align-items:center}
  .qstage{margin:auto 0 0}
  .qname{text-align:center;margin:20px 0 auto}
  .qname h2{font-size:26px;font-weight:700;letter-spacing:-.025em;margin:0 0 3px;line-height:1.05}
  .qname .qh{color:var(--muted);font-size:13.5px}
  .buckets{width:100%;display:flex;flex-direction:column;gap:10px}
  .bucket{padding:16px;display:flex;align-items:center;gap:14px;text-align:left;border:1.5px solid var(--line-dk);border-radius:14px}
  .bucket:active{background:var(--bg-3)}
  .bucket .bk{font-weight:700;font-size:16px;letter-spacing:-.01em}
  .bucket .bh{font-size:12.5px;color:var(--muted);margin-top:1px}
  .bucket .keycap{margin-left:auto;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}

  /* compare */
  .cwrap{flex:1;display:flex;flex-direction:column}
  .chead{text-align:center;padding:16px 20px 4px}
  .chead h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:6px 0 0}
  .cbody{flex:1;display:flex;flex-direction:column;padding:8px 18px 20px}
  .duel{flex:1;display:flex;flex-direction:column;gap:12px;position:relative;min-height:0}
  .choice{flex:1;min-height:0;display:flex;flex-direction:column;transition:opacity .18s var(--sp)}
  .choice .cplate{flex:1;min-height:0;transition:transform .16s var(--sp)}
  .choice .cmeta{padding:10px 2px 0;display:flex;align-items:baseline;gap:7px}
  .choice .cn{font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1}
  .choice .ch{font-size:12.5px;color:var(--muted)}
  .duel.picked .choice.dim{opacity:.32}
  .duel.picked .choice.win .cplate{transform:scale(.99)}
  .vsbadge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px -2px rgba(28,27,25,.28);display:grid;place-items:center;z-index:3;pointer-events:none;font-weight:700;font-size:13px;color:var(--ink-2)}
  .cfoot{text-align:center;padding-top:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .cfoot .tc{font-size:13.5px;font-weight:600;color:var(--ink-2);border:1.5px solid var(--line-dk);border-radius:12px;padding:10px 18px}
  .cfoot .tc:active{background:var(--bg-3)}

  /* result */
  .result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}
  .result .rk{font-weight:700;font-size:66px;letter-spacing:-.04em;line-height:.9;margin:8px 0 2px;color:var(--accent)}
  .result .of{font-size:13.5px;color:var(--muted);margin-bottom:26px}
  .result .rn{font-weight:700;font-size:18px;margin-top:14px}
  .result .rh{font-size:13px;color:var(--muted)}

  /* detail */
  .dwrap{flex:1;overflow-y:auto}
  .backbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;position:sticky;top:0;background:var(--bg);z-index:5}
  .backbar button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
  .backbar button:active{background:var(--bg-3)}
  .dhero{padding:2px 24px 10px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .dhero h1{font-size:28px;font-weight:700;letter-spacing:-.025em;margin:18px 0 3px;line-height:1.04}
  .dhero .dh{color:var(--muted);font-size:14px}
  .dmeta{display:flex;margin:18px 18px 4px;background:var(--bg-3);border:1.5px solid var(--line-dk);border-radius:14px}
  .dmeta .mi{flex:1;text-align:center;padding:14px 6px}
  .dmeta .mi+.mi{border-left:1px solid var(--line)}
  .dmeta .mv{font-weight:700;font-size:19px;letter-spacing:-.02em}
  .dmeta .ml{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
  .dnotes{padding:16px 24px 4px;text-align:center;font-size:14px;color:var(--ink-2)}
  .dnotes b{color:var(--ink);font-weight:700}
  .states{display:flex;gap:9px;padding:12px 18px 2px}
  .stog{flex:1;text-align:center;padding:11px 8px;border:1.5px solid var(--line-dk);border-radius:11px;font-size:13px;font-weight:700;color:var(--ink-2)}
  .stog.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .dact{padding:16px 18px 6px;display:flex;flex-direction:column;gap:10px}

  /* profile */
  .t5row{display:flex;gap:13px;overflow-x:auto;padding:0 18px 4px;-webkit-overflow-scrolling:touch}
  .t5row::-webkit-scrollbar{display:none}
  .t5{flex:none;width:66px;text-align:left;display:flex;flex-direction:column;gap:7px}
  .t5n{font-size:11px;color:var(--ink-2);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;width:66px}
  .t5n b{color:var(--accent)}
  .dna{padding:2px 18px 6px}
  .dnarow{display:flex;align-items:center;gap:12px;margin:0 0 12px}
  .dnarow .dn{width:80px;font-weight:600;font-size:13.5px;text-transform:capitalize;flex:none}
  .dnarow .track{flex:1;height:7px;border-radius:7px;background:var(--bg-2);overflow:hidden}
  .dnarow .fillp{height:100%;border-radius:7px;background:var(--accent);animation:grow .7s var(--sp)}
  @keyframes grow{from{width:0!important}}
  .dnarow .pct{font-weight:700;font-size:12.5px;color:var(--muted);width:28px;text-align:right}
  .stats{display:flex;margin:6px 18px;background:var(--bg-3);border:1.5px solid var(--line-dk);border-radius:14px}
  .stats .st{flex:1;padding:14px 8px;text-align:center}
  .stats .st+.st{border-left:1px solid var(--line)}
  .stats .stn{font-weight:700;font-size:24px;letter-spacing:-.02em}
  .stats .stl{font-size:11px;color:var(--muted);font-weight:600;margin-top:4px}
  .segment{display:flex;gap:8px;overflow-x:auto;padding:6px 18px 2px}
  .segment::-webkit-scrollbar{display:none}
  .segment button{flex:none;padding:8px 15px;border-radius:20px;border:1.5px solid var(--line-dk);font-size:13px;font-weight:600;color:var(--ink-2);background:var(--bg-2);white-space:nowrap}
  .segment button.on{background:var(--ink);color:#fff}
  .segtabs{display:flex;gap:22px;padding:10px 18px 0;border-bottom:1px solid var(--line)}
  .segtabs button{padding:10px 0;font-size:14px;font-weight:700;color:var(--muted);position:relative}
  .segtabs button.on{color:var(--ink)}
  .segtabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
  .empty{color:var(--muted);padding:44px 30px;text-align:center;font-size:14.5px;line-height:1.6;display:flex;flex-direction:column;align-items:center;gap:18px}
  .link{color:var(--accent);font-weight:700}
  .danger{color:var(--rust);font-weight:600}
  .disc{font-size:12.5px;color:var(--muted);padding:16px 20px;line-height:1.55}

  /* guide detail */
  .ghero{aspect-ratio:2/1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;position:relative}
  .ghero .gov{position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(20,16,14,.8));display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff}
  .ghero .gt{font-size:26px;font-weight:700;letter-spacing:-.02em}

  /* share card */
  .cardscreen{flex:1;display:flex;flex-direction:column;background:var(--accent)}
  .cardtop{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
  .cardtop button{color:#fff;width:38px;height:38px;display:grid;place-items:center}
  .cardtop .hint{color:rgba(255,255,255,.8);font-size:12.5px;font-weight:600}
  .poster{margin:0 16px 20px;flex:1;background:#fff;border-radius:18px;padding:26px 24px;display:flex;flex-direction:column}
  .poster .pk{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .poster .pwm{font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--accent);margin-top:auto}
  .poster .pdna{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:8px 0 0}
  .poster .plist{margin-top:22px;display:flex;flex-direction:column}
  .poster .pi{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
  .poster .pi:first-child{border-top:0}
  .poster .pr{font-weight:700;font-size:15px;color:var(--accent);width:18px;flex:none}
  .poster .pn2{font-weight:700;font-size:14.5px}
  .poster .ph2{font-size:11.5px;color:var(--muted)}
  .poster .pf{margin-top:18px;font-size:11.5px;color:var(--muted);font-weight:600}

  .scrn{animation:sc2 .28s var(--sp)}@keyframes sc2{from{opacity:0}to{opacity:1}}

function cosine(a,b){let d=0,na=0,nb=0;const ks=new Set([...Object.keys(a),...Object.keys(b)]);for(const k of ks){const x=a[k]||0,y=b[k]||0;d+=x*y;na+=x*x;nb+=y*y;}return(!na||!nb)?0:d/(Math.sqrt(na)*Math.sqrt(nb));}

function twinRecs(limit){const sc={};TWINS.forEach(t=>{const d=twinData(t);const wt=d.match/100;d.ids.forEach((id,idx)=>{if(inRanking(id))return;if(!sc[id])sc[id]={s:0,by:t.name,bym:d.match};sc[id].s+=wt*(1-idx/d.ids.length);if(d.match>sc[id].bym){sc[id].by=t.name;sc[id].bym=d.match;}});});return Object.entries(sc).map(([id,o])=>({id:+id,s:o.s,by:o.by})).sort((a,b)=>b.s-a.s).slice(0,limit||6);}

function twinData(t){const ids=t.picks.map(n=>nameId[n]).filter(x=>x!=null);const tw=weightsFor(ids),mw=myWeights();
  const match=Math.round(Math.min(98,Math.max(41,cosine(mw,tw)*100)));const overlap=ids.filter(id=>inRanking(id));
  const conf=overlap.length>=4?"High confidence":overlap.length>=2?"Growing":"Early estimate";
  return{match,conf,shared:overlap.map(id=>F[id][0]).slice(0,3),theirTop:ids.find(id=>!inRanking(id)),ids};}
const TRENDING=["Khamrah","Ombre Nomade","9pm","Fan Your Flames","Bitter Peach","Imagination","Asad","Erba Pura","Oud for Greatness","Delina","Naxos","Baccarat Rouge 540"].map(n=>nameId[n]).filter(x=>x!=null);
const STARTERS=["Sauvage EDT","Bleu de Chanel EDP","Dior Homme Intense","Y EDP","Aventus","Baccarat Rouge 540","Le Male","Eros","1 Million","Acqua di Gio Profumo","Naxos","Layton","Tobacco Vanille","Oud Wood","Khamrah","Stronger With You","Good Girl","Black Opium","La Vie Est Belle","Coco Mademoiselle"].map(n=>nameId[n]).filter(x=>x!=null);
const GUIDES=[
 {t:"Sweet Beast Mode",f:["Khamrah","Naxos","9pm","Fan Your Flames","Uomo Intense"]},
 {t:"Fresh & Clean",f:["Bleu de Chanel EDP","Sauvage EDT","Acqua di Gio Profumo","Silver Mountain Water","Allure Homme Sport"]},
 {t:"Niche Icons",f:["Naxos","Oud Wood","Interlude Man","Baccarat Rouge 540","Ombre Nomade"]},
 {t:"Date Night",f:["Layton","Tobacco Vanille","Sauvage Elixir","Bad Boy","Grand Soir"]},
 {t:"Beginner Starter Pack",f:["Bleu de Chanel EDP","Eros","Sauvage EDT","Le Male","Y EDP"]}
].map(g=>({t:g.t,ids:g.f.map(n=>nameId[n]).filter(x=>x!=null)}));
function feedItems(){const out=[];TWINS.forEach((t,ti)=>{t.picks.slice(0,2).forEach((n,i)=>{const id=nameId[n];if(id==null)return;
  out.push({name:t.name,id,score:+(9.5-i*0.6-ti*0.15).toFixed(1),likes:3+((ti*5+i*3)%9),time:i?((ti+2)+'h ago'):(ti?ti+'h ago':'Just now')});});});return out.slice(0,8);}

const app=document.getElementById('app');
function esc(s){return(s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
let render=function(){let h;const s=V.screen;

function viewMain(){let b;if(V.tab==='home')b=tabHome();else if(V.tab==='explore')b=tabExplore();else if(V.tab==='activity')b=tabActivity();else b=tabProfile();return b+nav();}

function tabActivity(){const top=`<div class="top"><div class="htitle"><h1>Activity</h1></div></div>`;
  if(S.ranking.length<3)return top+`<div class="fill"><div class="empty">${plate(nameId["Aventus"],80,116,12)}<div>Rank a few fragrances and we'll surface friend recs and your closest taste matches.</div></div></div>`;

    <div class="meta"><div class="nm">You recommended <b>${esc(F[r.frag][0])}</b> to ${esc(r.to)}</div><div class="hs">${r.msg?esc(r.msg):esc(relTime(r.ts))}</div></div>${plate(r.frag,40,54,8)}</button>`).join('');
  return top+`<div class="fill scrn">${sent?`<div class="shead"><div class="st">Sent by you</div></div><div class="list">${sent}</div>`:''}
    ${recSec?`<div class="shead"><div class="st">Recommended to you</div></div><div class="list">${recSec}</div>`:''}

/* ================= events ================= */
function openDetail(id){V.detailBack=(V.screen==='main')?V.tab:(V.screen==='addsearch'?'home':(V.screen==='guide'?'home':V.detailBack));V.detailId=id;V.screen='detail';render();}
function bind(){
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;
    if(g==='pick'){V.screen='pick';V.pickSel=[];V.pickQuery='';}else if(g==='main'){V.screen='main';if(b.dataset.tab)V.tab=b.dataset.tab;}
    else if(g==='addsearch'){V.screen='addsearch';V.query='';}else if(g==='card')V.screen='card';else if(g==='compose')V.screen='compose';
    else if(g==='guides')V.screen='guides';else if(g==='guidenew'){V.gTitle='';V.gIds=[];V.gQuery='';V.screen='guidenew';}render();});
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pick,k=V.pickSel.indexOf(i);if(k>=0)V.pickSel.splice(k,1);else V.pickSel.push(i);render();});
  const pq=app.querySelector('#pickq');if(pq)pq.oninput=()=>{V.pickQuery=pq.value;const p=pq.selectionStart;app.innerHTML=viewPick();bind();const n=app.querySelector('#pickq');if(n){n.focus();try{n.setSelectionRange(p,p);}catch(e){}}};
  const so=app.querySelector('[data-startonb]');if(so)so.onclick=()=>startInsert(V.pickSel,'onboard');
  app.querySelectorAll('[data-bucket]').forEach(b=>b.onclick=()=>chooseBucket(b.dataset.bucket));
  app.querySelectorAll('[data-cmp]').forEach(b=>b.onclick=()=>{const v=b.dataset.cmp;if(v==='close'){tooClose();return;}
    const duel=app.querySelector('#duel');if(duel){duel.classList.add('picked');b.classList.add('win');app.querySelectorAll('.choice').forEach(c=>{if(c!==b)c.classList.add('dim');});}
    setTimeout(()=>chooseCompare(v==='new'),190);});
  app.querySelectorAll('[data-navtab]').forEach(b=>b.onclick=()=>{V.tab=b.dataset.navtab;V.screen='main';render();});
  app.querySelectorAll('[data-detail]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-tried],[data-like]'))return;openDetail(+b.dataset.detail);});
  app.querySelectorAll('[data-tried]').forEach(b=>b.onclick=e=>{e.stopPropagation();startInsert([+b.dataset.tried],'add');});
  app.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{V.guideRef=b.dataset.guide;V.screen='guide';render();});
  app.querySelectorAll('[data-gtoggle]').forEach(b=>b.onclick=()=>{const gt=app.querySelector('#gtitle');if(gt)V.gTitle=gt.value;const id=+b.dataset.gtoggle,k=V.gIds.indexOf(id);if(k>=0)V.gIds.splice(k,1);else V.gIds.push(id);render();});
  const cg=app.querySelector('[data-createguide]');if(cg)cg.onclick=()=>{const gt=app.querySelector('#gtitle');if(gt)V.gTitle=gt.value;if(!V.gTitle.trim()||!V.gIds.length)return;S.guides.unshift({id:Date.now(),title:V.gTitle.trim(),ids:V.gIds.slice()});save();V.gTitle='';V.gIds=[];V.gQuery='';V.guideRef='u0';V.screen='guide';render();};
  const gti=app.querySelector('#gtitle');if(gti)gti.oninput=()=>{V.gTitle=gti.value;const x=app.querySelector('[data-createguide]');if(x)x.classList.toggle('on',!!(gti.value.trim()&&V.gIds.length));};
  const gse=app.querySelector('#gsearch');if(gse)gse.oninput=()=>{const gt=app.querySelector('#gtitle');if(gt)V.gTitle=gt.value;V.gQuery=gse.value;const p=gse.selectionStart;app.innerHTML=viewGuideNew();bind();const n=app.querySelector('#gsearch');if(n){n.focus();try{n.setSelectionRange(p,p);}catch(e){}}};
  app.querySelectorAll('[data-delguide]').forEach(b=>b.onclick=()=>{if(confirm('Delete this guide?')){S.guides.splice(+b.dataset.delguide,1);save();V.screen='guides';render();}});
  app.querySelectorAll('[data-recommend]').forEach(b=>b.onclick=()=>{V.recFrag=+b.dataset.recommend;V.recTo=null;V.screen='recommend';render();});
  app.querySelectorAll('[data-recto]').forEach(b=>b.onclick=()=>{V.recTo=b.dataset.recto;render();});
  app.querySelectorAll('[data-back-detail]').forEach(b=>b.onclick=()=>{V.screen='detail';render();});
  const sr=app.querySelector('[data-sendrec]');if(sr)sr.onclick=()=>{if(!V.recTo)return;const m=app.querySelector('#recmsg');S.sentRecs.unshift({frag:V.recFrag,to:V.recTo,msg:m?m.value.trim():'',ts:Date.now()});save();V.recTo=null;V.screen='main';V.tab='activity';render();};
  app.querySelectorAll('[data-notifs]').forEach(b=>b.onclick=()=>{V.screen='notifs';S.notifSeen=true;save();render();});
  app.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{if(V.screen==='main')V.personBack=V.tab;V.personName=b.dataset.person;V.screen='person';render();});
  app.querySelectorAll('[data-follow]').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=b.dataset.follow,k=S.following.indexOf(n);if(k>=0)S.following.splice(k,1);else S.following.push(n);save();render();});
  app.querySelectorAll('[data-like]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=+b.dataset.like;V.liked[id]=!V.liked[id];render();});
  app.querySelectorAll('[data-rerank]').forEach(b=>b.onclick=()=>rerank(+b.dataset.rerank));
  app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('Remove this from your ranking?'))removeF(+b.dataset.remove);});
  app.querySelectorAll('[data-homeseg]').forEach(b=>b.onclick=()=>{V.homeSeg=b.dataset.homeseg;render();});
  app.querySelectorAll('[data-profseg]').forEach(b=>b.onclick=()=>{V.profSeg=b.dataset.profseg;render();});
  app.querySelectorAll('[data-rankfam]').forEach(b=>b.onclick=()=>{V.rankFam=b.dataset.rankfam;render();});
  app.querySelectorAll('[data-explore]').forEach(b=>b.onclick=()=>{const[t,v]=b.dataset.explore.split(':');const nv=t==='like'?+v:v;V.explore=(V.explore&&V.explore.t===t&&V.explore.v===nv)?null:{t,v:nv};render();});
  app.querySelectorAll('[data-tog]').forEach(b=>b.onclick=e=>{e.stopPropagation();tog(b.dataset.tog,+b.dataset.id);render();});
  app.querySelectorAll('[data-attach]').forEach(b=>b.onclick=()=>{const t=app.querySelector('#postbody');if(t)V.composeBody=t.value;const id=+b.dataset.attach;V.composeAttach=V.composeAttach===id?null:id;render();});
  const pb=app.querySelector('[data-post]');if(pb)pb.onclick=()=>{const t=app.querySelector('#postbody');const body=(t?t.value:V.composeBody).trim();if(!body)return;S.posts.unshift({id:Date.now(),body,frag:V.composeAttach,createdAt:Date.now()});V.composeBody='';V.composeAttach=null;save();V.screen='main';V.tab='home';render();};
  const pt=app.querySelector('#postbody');if(pt)pt.oninput=()=>{V.composeBody=pt.value;const w=pt.value.trim()?pt.value.trim().split(/\s+/).length:0;const c=app.querySelector('#pcount');if(c)c.textContent=w+'/50 words';const x=app.querySelector('[data-post]');if(x)x.classList.toggle('on',!!pt.value.trim());};
  const rb=app.querySelector('[data-reset]');if(rb)rb.onclick=()=>{if(confirm('Reset everything?')){S={onboarded:false,ranking:[],owned:[],tried:[],want:[],posts:[],guides:[],sentRecs:[],following:[],notifSeen:false};save();V={screen:'intro',tab:'home',pickSel:[],queue:[],cur:null,query:'',detailBack:'home',homeSeg:'recs',profSeg:'ranking',rankFam:'all',explore:null,guideRef:null,liked:{},composeBody:'',composeAttach:null,gTitle:'',gIds:[],gQuery:'',recFrag:null,recTo:null,personName:null,personBack:'activity',pickQuery:''};render();}};
  const q=app.querySelector('#q');if(q)q.oninput=()=>{V.query=q.value;const p=q.selectionStart;app.innerHTML=viewAddSearch();bind();const nq=app.querySelector('#q');if(nq){nq.focus();try{nq.setSelectionRange(p,p);}catch(e){}}};
}
render();
</script>
